# Contributor hooks for the pystrip repository itself.
# Install with: uv run pre-commit install   (or: pipx run pre-commit install)
# Bump pinned versions with: pre-commit autoupdate
#
# Note: pystrip does not strip its own source, which intentionally keeps its
# docstrings and comments, so the pystrip hook is not enabled here.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: mixed-line-ending

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.6
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
