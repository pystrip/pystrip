[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "pystrip"
dynamic = ["version"]
description = "Remove comments and docstrings from Python source files"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
keywords = [
    "python",
    "comments",
    "docstrings",
    "type-annotations",
    "strip",
    "libcst"
]
dependencies = [
    "libcst>=1.1.0",
    "rich>=13.0.0",
]
authors = [
  { name = "Zeecka", email = "alex.garrido@protonmail.com" }
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3 :: Only",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Topic :: Software Development :: Code Generators",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: Utilities",
  "Typing :: Typed",
]

[project.urls]
Homepage = "https://pystrip.github.io/pystrip/"
Documentation = "https://pystrip.github.io/pystrip/"
Repository = "https://github.com/pystrip/pystrip"
Issues = "https://github.com/pystrip/pystrip/issues"
Changelog = "https://github.com/pystrip/pystrip/blob/main/CHANGELOG.md"

[project.scripts]
pystrip = "pystrip.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.5.0",
    "ty>=0.0.1a12",
]
docs = [
    "mkdocs-material>=9.5.0",
    "mkdocs>=1.6.0",
]

[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
# Only release tags (vX.Y.Z) set the version: the moving `v1` Action tag must not.
git_describe_command = ["git", "describe", "--dirty", "--tags", "--long", "--match", "v[0-9]*.[0-9]*.[0-9]*"]

[tool.hatch.build.targets.wheel]
packages = ["src/pystrip"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ARG"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"

[tool.coverage.run]
source = ["pystrip"]
branch = true

[tool.coverage.report]
show_missing = true
precision = 1
fail_under = 80
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[tool.pystrip]
remove_comments = true
remove_docstrings = true
exclude = ["tests/"]
exclude_glob = ["*.generated.py"]
line_length = 100
jobs = 4
